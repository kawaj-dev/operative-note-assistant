<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Operative Note Assistant{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <header class="site-header"><a class="brand" href="{{ url_for('index') }}"><span class="brand-mark">N</span><span>Operative Note Assistant<small>オペレコ作成支援アプリ</small></span></a><span class="badge">v0.1 / 架空症例専用</span></header>
  <div class="privacy">実在する患者・症例の情報は入力しないでください <span>学習・機能検証用です。実際の診療には使用できません。</span></div>
  <main>{% block content %}{% endblock %}</main>
  <footer>Operative Note Assistant · 必要な情報を、漏れなく、書きやすく。</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
